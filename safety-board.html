<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 반 디지털 안전 약속 — 게시판 시제품</title>
<style>
:root{font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#38261d;background:#f7f0e4}
*{box-sizing:border-box}body{margin:0;min-height:100dvh}
button,input{font:inherit}button{cursor:pointer}
.app{max-width:1600px;margin:auto;padding:10px 14px 28px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:6px 10px 12px}
.toolbar .demo{font-size:12px;color:#735d4d}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls button{border:1px solid #bda68e;border-radius:9px;padding:7px 12px;background:#fff9ed;color:#563d2e}
.controls button:hover{background:#fff0cd}
.controls label{font-size:13px;display:flex;align-items:center;gap:5px}
.controls input{width:60px;padding:7px;border:1px solid #bea68a;border-radius:9px;background:#fff}
.board{position:relative;width:100%;aspect-ratio:1.74;background:url('assets/cork-board.png') center/100% 100% no-repeat;isolation:isolate}
.inner{position:absolute;inset:7% 5.6% 7.8%;display:flex;flex-direction:column;gap:.5%;min-height:0}
.header{flex:0 0 11.5%;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:1.2%}
.header img{height:82%;max-width:72%;object-fit:contain;pointer-events:none}
.status{position:absolute;bottom:-18%;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap;background:#fff8e8;border:2px solid #d59b56;box-shadow:0 2px 0 #916038;border-radius:100px;padding:4px 18px;font-weight:800;font-size:clamp(11px,1.1vw,16px)}
.notes{padding:2.5% 2% 0%;flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:2% 2.2%}
.note{position:relative;min-width:0;min-height:0;overflow:hidden;text-align:left;border:0;border-radius:4px 4px 15px 5px;background:var(--note);box-shadow:3px 4px 0 rgba(96,57,30,.25),0 4px 9px rgba(60,34,15,.15);padding:12px 8px 8px;transform:rotate(var(--angle));transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;gap:4px;color:#493328}
.note:focus-visible{outline:3px solid #342467;outline-offset:2px}
.note:hover{transform:rotate(0) translateY(-2px);box-shadow:3px 6px 8px rgba(60,34,15,.24)}
.note:before{content:"";position:absolute;top:2px;left:50%;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8dc 0 15%,var(--pin) 40% 72%,#996b34 100%);box-shadow:0 2px 2px #865e4f78;transform:translateX(-50%)}
.note:after{content:"";position:absolute;right:0;bottom:0;width:0;height:0;border-width:0 0 16px 17px;border-style:solid;border-color:transparent transparent #ffffff88 transparent;filter:drop-shadow(-1px -1px 1px #9c765055)}
.note .number{font-weight:900;font-size:clamp(11px,1.05vw,17px);white-space:nowrap}
.note .message{font-size:clamp(9px,.92vw,14px);font-weight:600;line-height:1.28;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;line-clamp:4;overflow-wrap:anywhere}
.note.empty{background:#ead3ad;box-shadow:inset 0 1px 5px #966f3e55;color:#81674d;opacity:.83}
.note.empty .message{font-weight:400;font-size:clamp(9px,.9vw,13px)}
.note.empty:after{display:none}
.note.reveal{animation:pop .5s cubic-bezier(.22,1.45,.43,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(var(--angle))}}
.modal{position:fixed;inset:0;background:#291a17ae;z-index:10;display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex}.modal-card{position:relative;background:var(--modal-note,#fff1ad);border:2px solid color-mix(in srgb, var(--modal-note,#fff1ad) 70%, #8a5d38 30%);border-radius:12px;padding:30px;max-width:600px;width:min(100%,600px);max-height:85dvh;overflow:auto;box-shadow:0 20px 65px #21140e70;transform:rotate(-1deg)}
.modal-number{font-size:22px;font-weight:900}.modal-message{font-size:clamp(18px,2.5vw,27px);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.modal-close{position:absolute;right:12px;top:9px;background:transparent;border:0;font-size:28px}
.footer{font-size:12px;text-align:center;color:#796758;margin-top:6px}
@media (max-width:820px){.app{padding:4px}.toolbar{padding:7px}.board{aspect-ratio:1.45}.inner{inset:7% 6% 8%}.header{flex-basis:10%}.header img{max-width:68%;height:78%}.notes{padding-top:3.2%;gap:2%}.note{padding:11px 5px 4px}.note:before{width:11px;height:11px}.note .message{-webkit-line-clamp:3}.status{bottom:-22%;font-size:11px;padding:2px 9px}}
@media (max-width:600px) and (orientation:portrait){.board{aspect-ratio:auto;min-height:calc(100dvh - 120px);background-size:100% 100%}.inner{inset:7% 7% 7%}.header{flex-basis:9%}.header img{max-width:74%;height:72%}.notes{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:none;grid-auto-rows:minmax(88px,1fr);overflow-y:auto;gap:9px;padding:14px 2px 0}.note .number{font-size:11px}.note .message{font-size:10px}.note:after{border-width:0 0 10px 11px}.status{bottom:-26%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

/* v3: one-screen electronic-whiteboard layout; no page scrolling. */
html,body{height:100%;height:100dvh;overflow:hidden}
body{min-width:0}
.app{height:100%;height:100dvh;min-height:0;max-width:none;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:4px 9px 5px}
.toolbar{flex:0 0 auto;width:100%;min-height:37px;padding:2px 7px 5px;gap:5px}
.controls{gap:5px}
.controls button{padding:4px 9px;font-size:12px}
.controls input{padding:4px;width:52px;font-size:13px}
.controls label{font-size:12px}
.board{flex:1 1 auto;min-height:0;min-width:0;width:min(100%,calc((100dvh - 78px)*1.78));max-height:100%;aspect-ratio:auto;background-size:100% 100%;margin:0 auto}
.inner{position:absolute;inset:0;display:block;min-height:0}
.header{position:absolute;top:7.8%;left:8%;right:8%;height:10%;margin:0;display:flex;justify-content:center;align-items:center}
.header img{height:100%;max-height:100%;width:auto;max-width:48%;object-fit:contain}
.status{position:absolute;left:auto;right:0;top:50%;bottom:auto;transform:translateY(-50%);font-size:clamp(12px,1.15vw,17px);padding:5px 12px;line-height:1.2}
.notes{position:absolute;top:20%;bottom:8.3%;left:6.2%;right:6.2%;display:grid;padding:0;min-height:0;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:1.8% 2%}
.note{padding:15px 8px 7px;gap:4px;border-radius:4px 4px 13px 5px}
.note .number{font-size:clamp(12px,1.3vw,19px)}
.note .message{font-size:clamp(11px,1.16vw,17px);line-height:1.25;-webkit-line-clamp:4;line-clamp:4}
.note.empty .message{font-size:clamp(10px,1vw,14px)}
.footer{flex:0 0 auto;margin:2px 0 0;padding:0;text-align:center;font-size:11px;line-height:1.2}
@media (max-width:960px){
 .board{width:min(100%,calc((100dvh - 82px)*1.68))}
 .header{top:8%;height:9.5%}
 .header img{max-width:52%}
 .status{font-size:12px;padding:3px 7px}
 .notes{top:20%;bottom:8%;left:6.3%;right:6.3%;gap:1.5% 1.8%;padding:0}
 .note{padding:12px 5px 5px}
 .note .number{font-size:clamp(11px,1.35vw,15px)}
 .note .message{font-size:clamp(10px,1.23vw,14px);-webkit-line-clamp:4}
 .toolbar .demo{font-size:10px}
}
@media(max-height:650px) and (orientation:landscape){
 .toolbar{min-height:28px;padding:1px 5px 3px}
 .controls button{padding:2px 7px;font-size:11px}
 .board{width:min(100%,calc((100dvh - 58px)*1.78))}
 .header{top:7.8%;height:9%}
 .notes{top:20%;bottom:8.3%}
 .note{padding:10px 5px 3px;gap:1px}
 .note .number{font-size:clamp(10px,1.25vw,16px)}
 .note .message{font-size:clamp(9px,1.05vw,14px);line-height:1.18}
 .footer{font-size:10px}
}
@media (orientation:portrait){
 .app{padding:3px}
 .toolbar{justify-content:center}
 .toolbar .demo{display:none}
 .board{width:100%;height:auto;min-height:0;aspect-ratio:auto;background-size:100% 100%}
 .header{top:7.5%;height:10%;left:7%;right:7%}
 .header img{max-width:62%;height:85%}
 .status{font-size:10px;padding:2px 5px;right:-1%}
 .notes{top:20%;bottom:8%;left:7%;right:7%;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:none;grid-auto-rows:minmax(0,1fr);overflow:hidden;gap:1.1% 2%;padding:0}
 .note{padding:10px 4px 3px;gap:1px}
 .note:before{height:9px;width:9px;top:1px}
 .note .number{font-size:clamp(9px,2.3vw,13px)}
 .note .message{font-size:clamp(8px,2.05vw,11px);line-height:1.13;-webkit-line-clamp:3}
 .note.empty .message{font-size:9px}
 .footer{font-size:9px}
}

/* v4: enlarge the title artwork only. Keep the approved note grid and viewport locked. */
.header img{transform:translateY(-13%) scale(1.6);transform-origin:center center}
@media(max-width:960px){.header img{transform:translateY(-12%) scale(1.48)}}
@media(orientation:portrait){.header img{transform:translateY(-10%) scale(1.32)}}

/* teacher gate does not grant Firestore permissions; Firebase Authentication protects moderation */
.pin-gate{position:fixed;inset:0;z-index:100;background:#2a3549;display:grid;place-items:center;padding:20px}
.pin-panel{width:min(90vw,370px);text-align:center;background:#fff9ed;border:5px solid #c7a47b;border-radius:22px;padding:30px 24px;box-shadow:0 15px 60px #10121c99}
.pin-panel input{font:26px system-ui;padding:9px;width:150px;text-align:center;border:1px solid #baa288;border-radius:9px}
.pin-panel button{margin-left:8px;padding:12px;border-radius:8px;border:0;background:#a97745;color:#fff;font-weight:800}
.pin-panel #pinError{min-height:20px;color:#a33329;font-size:13px}
.moderate-hint{font-size:12px;opacity:.72}
body:not(.entered) .app{display:none}
</style></head>
<body>
<div id="pinGate" class="pin-gate"><form id="pinForm" class="pin-panel"><h2>교사용 게시판</h2><p>교사용 PIN을 입력해 주세요.</p><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="교사용 PIN" required><button type="submit">입장</button><p id="pinError" aria-live="polite"></p></form></div>
<main class="app" id="app" hidden>
  <div class="toolbar">
    <span class="demo">실시간 디지털 안전 약속 게시판</span>
    <div class="controls">
      <label>전체 인원 <input id="total" type="number" min="1" max="30" value="20" aria-label="전체 학생 수" disabled></label>
      <button id="teacherLogin">Firebase 관리자 인증 · 게시판 보기</button>
      <button id="hide" disabled>선택 의견 숨김</button>
      <button id="clear" disabled>전체 초기화</button>
      <button id="logout" hidden>관리자 로그아웃</button>
    </div>
  </div>
  <section class="board" aria-label="우리 반 디지털 안전 약속 게시판">
    <div class="inner">
      <div class="header"><img src="assets/board-title.png" alt="우리 반 디지털 안전 약속"><div class="status" id="status" aria-live="polite"></div></div>
      <div class="notes" id="notes"></div>
    </div>
  </section>
  <div class="footer" id="connection">연결 중…</div>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="학생의 안전 약속">
  <div class="modal-card"><button class="modal-close" id="close" aria-label="닫기">×</button><div class="modal-number" id="modalNumber"></div><p class="modal-message" id="modalMessage"></p><p id="moderateHint" class="moderate-hint"></p></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script><script src="firebase-client.js"></script>
<script src="safety-board.js"></script>
</body></html>
