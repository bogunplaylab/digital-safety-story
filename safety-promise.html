<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>나의 디지털 안전 약속 | 우리들의 디지털 안전 이야기</title>
<style>
:root{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;color:#eff6ff;background:#101f31;font-synthesis:none}
*{box-sizing:border-box}html,body{margin:0;min-width:0;min-height:100%;}button,input,textarea,select{font:inherit}button{cursor:pointer}
.shell{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;background:#101f31}
.top{flex:none;min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px clamp(14px,2vw,32px);background:#142740;color:#e9f4ff;font-size:clamp(12px,1.2vw,15px)}.top .preview{font-size:11px;opacity:.82}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;isolation:isolate;display:flex;align-items:center;justify-content:center;padding:clamp(12px,2.4vh,32px)}
.stage:before{content:"";position:absolute;inset:-2%;background:url('assets/classroom.png') center/cover no-repeat;filter:blur(3px) brightness(.68);transform:scale(1.04);z-index:-2}
.stage:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(8,26,51,.4),rgba(7,22,44,.13) 55%,rgba(7,24,48,.48));z-index:-1}
.content{width:min(100%,1090px);height:min(100%,750px);min-height:0;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.5vh,17px)}
.game-logo{height:clamp(75px,16.5vh,170px);max-width:min(80vw,370px);width:auto;object-fit:contain;flex-shrink:1;filter:drop-shadow(0 5px 12px #0e18377a)}
.panel{position:relative;min-height:0;width:min(100%,950px);flex:1;display:flex;flex-direction:column;border-radius:20px;border:2px solid rgba(213,226,239,.55);background:rgba(23,46,73,.94);box-shadow:0 14px 44px #101b35a6;backdrop-filter:blur(9px);padding:clamp(21px,3vh,33px) clamp(20px,3.8vw,48px) clamp(14px,2.5vh,24px)}
.name{position:absolute;top:-17px;left:clamp(18px,4vw,45px);background:#eed8a8;color:#2f4359;padding:7px 19px;border-radius:11px;font-weight:900;box-shadow:0 4px 12px #07182ba0;font-size:clamp(16px,1.6vw,21px)}
.title{margin:5px 0 5px;font-size:clamp(23px,2.5vw,32px);font-weight:900;letter-spacing:-.02em}.sub{font-size:clamp(13px,1.3vw,16px);color:#d6e5f5;margin:0 0 clamp(12px,2.2vh,23px);line-height:1.45}
.form{display:flex;flex:1;min-height:0;flex-direction:column;gap:clamp(8px,1.4vh,15px)}.row{display:grid;grid-template-columns:minmax(0,.55fr) minmax(0,1.45fr);gap:14px}label{display:block;font-weight:850;font-size:clamp(13px,1.2vw,16px);margin-bottom:5px}
.field{display:block;width:100%;color:#19344e;border:2px solid #abc3d8;background:#f3f7fb;border-radius:12px;outline-offset:2px;padding:clamp(9px,1.2vh,13px) 13px;font-size:clamp(14px,1.3vw,17px)}.field:focus{outline:3px solid #efcf8c;border-color:#d9b374}.field select{background:#fff}textarea.field{resize:none;flex:1;min-height:75px;max-height:210px;line-height:1.52}
.write{display:flex;min-height:0;flex:1;flex-direction:column}.counter{text-align:right;font-size:12px;color:#ceddec;margin-top:4px}.hint{margin:0;font-size:clamp(11px,1.05vw,13px);line-height:1.4;color:#e1eaf5}.error{font-size:12px;min-height:15px;color:#ffe0a7}.action{align-self:flex-end;border:1px solid #f0daa4;border-radius:13px;padding:10px 23px;min-height:43px;background:#f0daa4;color:#23384e;font-weight:900;font-size:clamp(14px,1.3vw,17px);box-shadow:0 4px 10px #0b1c3080}.action:disabled{opacity:.8}.bottom{position:absolute;bottom:8px;right:13px;z-index:3;font-size:10px;color:#d9e4edb3;pointer-events:none}
.done{display:none;overflow:auto;flex:1;text-align:center;align-self:center;width:100%;padding:10px 6px;min-height:0}.done .icon{font-size:clamp(37px,7vh,65px)}.done h2{font-size:clamp(22px,2.7vw,32px);margin:3px 0 8px}.done p{line-height:1.5}.receipt{margin:12px auto;background:#f0daa4;color:#263d53;width:min(100%,570px);border-radius:13px;text-align:left;padding:15px 20px;box-shadow:0 5px 0 #a78c60}.receipt p{overflow-wrap:anywhere;margin:7px 0}.ghost{background:#f3f7fb;color:#193e5c;border:2px solid #a6c0d8;border-radius:11px;font-weight:800;padding:8px 20px}.done small{color:#c8d6e5}
@media(max-height:700px) and (min-width:701px){.top{min-height:34px;padding:4px 18px}.stage{padding:8px 20px}.content{gap:6px}.game-logo{height:clamp(52px,13vh,90px)}.panel{padding:18px 24px 12px}.title{font-size:22px;margin:1px 0}.sub{margin-bottom:5px}.form{gap:5px}.row{gap:10px}label{margin-bottom:3px;font-size:13px}.field{padding:7px 10px;font-size:14px}textarea.field{min-height:56px}.hint{font-size:11px}.action{min-height:35px;padding:6px 18px}.counter{margin-top:2px}.name{font-size:14px;padding:5px 13px}}
@media(max-width:700px){.top{font-size:11px;min-height:35px}.top .preview{display:none}.stage{padding:10px}.content{gap:8px}.game-logo{height:85px}.panel{padding:23px 15px 12px}.title{font-size:22px}.sub{font-size:13px}.row{grid-template-columns:1fr 1.5fr;gap:8px}.field{font-size:13px;padding:8px}.hint{font-size:11px}.action{padding:8px 17px}.name{left:15px;font-size:15px}}
@media(max-width:700px) and (orientation:portrait){.shell{min-height:100dvh;height:auto}.stage{min-height:calc(100dvh - 35px);overflow:visible}.content{height:auto;max-height:none}.panel{min-height:530px}.game-logo{height:90px}textarea.field{min-height:130px}.done{max-height:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="shell">
<div class="top"><strong>우리들의 디지털 안전 이야기 · 마무리 활동</strong><span class="preview">개인 수업용 · 디지털 안전 약속</span></div>
<div class="stage"><div class="content">
<img class="game-logo" src="assets/opening_title_logo.png" alt="우리들의 디지털 안전 이야기">
<section class="panel" aria-label="학생 개인활동"><div class="name">나의 디지털 안전 약속</div>
<h1 class="title">게임 속에서 배운 것을 실천해 볼까요?</h1><p class="sub">가장 기억에 남는 상황을 떠올리고 내가 지킬 안전 행동을 한 문장으로 적어 보세요.</p>
<form class="form" id="form" novalidate>
<div class="row"><div><label for="studentNo">학생 번호</label><select class="field" id="studentNo" required><option value="">번호 선택</option></select></div><div><label for="topic">가장 기억에 남는 상황</label><select class="field" id="topic" required><option value="">상황 선택</option><option value="개인정보 요구">낯선 사람의 개인정보 요구</option><option value="사진·영상 공유">사진·영상 공유와 동의</option><option value="도윤의 AI 합성 사진 피해">도윤의 고민 — AI로 만든 합성 사진 피해</option><option value="유나의 채팅 성희롱">유나의 고민 — 채팅에서 반복된 성적인 농담</option></select></div></div>
<div class="write"><label for="promise">내가 실천할 디지털 안전 행동 한 가지</label><textarea class="field" id="promise" maxlength="140" placeholder="예: 누군가 개인정보를 요구하면 알려주지 않고 믿을 수 있는 어른에게 도움을 요청하겠습니다." required></textarea><div class="counter" id="counter">0 / 140자</div></div>
<p class="hint">전자칠판에 공유될 글이에요. 친구의 이름이나 개인정보를 쓰지 말고, 실천할 행동을 구체적으로 적어 주세요.</p>
<div class="error" id="error" aria-live="polite"></div><button class="action" type="submit" id="submit" disabled>연결 확인 중</button></form>
<div class="done" id="done" aria-live="polite"><div class="icon" aria-hidden="true">✅</div><h2>나의 안전 약속 작성 완료!</h2><p>멋진 약속을 적었어요.<br><strong>선생님께 활동을 확인받으세요.</strong></p><div class="receipt"><b id="resultNo"></b><p id="resultTopic"></p><p id="resultPromise"></p></div><small>제출한 약속이 전자칠판 게시판에 표시됩니다.</small><p><button class="ghost" type="button" id="edit">내용 수정하기</button></p></div>
</section></div><div class="bottom">© JH Studio</div></div></main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
